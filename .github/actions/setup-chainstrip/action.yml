name: setup-chainstrip
description: Install the prebuilt chainstrip CLI from GitHub Packages and expose it as $CHAINSTRIP.
# CI-only and token-free: reads @chainstrip/cli from GitHub Packages with the
# workflow's ambient GITHUB_TOKEN (the job needs `permissions: packages: read`).
# No secret in this repo; the package is published from the private source repo.
inputs:
  package:
    description: "the GitHub Packages npm package holding the CLI"
    default: "@chainstrip/cli"
  version:
    description: "npm version or dist-tag (pin an exact version in real use)"
    default: latest
  csbox:
    description: >-
      Containment launcher to install beside the CLI, as name@version. Blank
      installs none, and chainstrip then runs uncontained unless the config
      says otherwise. It is a SEPARATE input because it is a native binary
      published one package per platform, and because a run that silently lost
      its launcher would report `kernel: false` rather than failing.
    default: ""
  csbox_path:
    description: >-
      Absolute path to an already-installed csbox, used INSTEAD of `csbox`, and
      it wins when both are set. This is the WEAKER option and it exists for a
      measured reason: GitHub Packages access is per PACKAGE, and this repo's
      ambient token reads @chainstrip/cli while the same token was refused
      @chainstrip/csbox-linux-x64 with `403 permission_denied: read_package`.
      Granting that package Actions read access to this repo is the durable fix
      and makes `csbox` work; a path is what a self-hosted runner can use in the
      meantime, and it ties the run to one machine.
    default: ""
runs:
  using: composite
  steps:
    - name: install & expose chainstrip
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }} # ambient repo token; only reads a package
      run: |
        set -euo pipefail
        dst="$RUNNER_TEMP/chainstrip"; mkdir -p "$dst"
        # scoped registry + token; npm expands ${NODE_AUTH_TOKEN} from env at read time
        cat > "$dst/.npmrc" <<'EOF'
        @chainstrip:registry=https://npm.pkg.github.com
        //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
        EOF
        ( cd "$dst" && npm install "${{ inputs.package }}@${{ inputs.version }}" )
        echo "CHAINSTRIP=node $dst/node_modules/${{ inputs.package }}/dist/cli.mjs" >> "$GITHUB_ENV"

        # THE LAUNCHER GOES BESIDE THE CLI, so node's own resolution finds it.
        # chainstrip locates csbox with
        # `createRequire(import.meta.url).resolve("<pkg>/bin/csbox")` anchored at
        # its own dist/cli.mjs — deliberately, because two earlier designs walked
        # the filesystem and an independent reviewer defeated both by PLANTING a
        # binary. Installing into the same prefix is what that resolution expects
        # and needs no CHAINSTRIP_CSBOX override.
        #
        # A FAILED INSTALL IS FATAL rather than a warning. The alternative is a
        # run that reports `kernel: false` and completes, which is enforcement
        # nobody notices was absent — the "absence reads as fine" failure this
        # pipeline keeps recording. `npm install` already exits non-zero and
        # `set -e` is on, and the check below covers the case where it does not.
        bin=""
        if [ -n "${{ inputs.csbox_path }}" ]; then
          bin="${{ inputs.csbox_path }}"
          test -x "$bin" || { echo "csbox_path names $bin, which is not an executable file"; exit 1; }
          # CHAINSTRIP_CSBOX is the resolver's ONE explicit override, and typing
          # it is the decision — the resolver otherwise asks node, and refuses
          # to search the filesystem, because two earlier designs that did were
          # defeated by planting a binary.
          echo "CHAINSTRIP_CSBOX=$bin" >> "$GITHUB_ENV"
        elif [ -n "${{ inputs.csbox }}" ]; then
          ( cd "$dst" && npm install "${{ inputs.csbox }}" )
          bin="$dst/node_modules/@chainstrip/csbox-linux-$(node -p 'process.arch')/bin/csbox"
          test -x "$bin" || { echo "csbox installed but $bin is not executable"; exit 1; }
        fi
        if [ -n "$bin" ]; then
          "$bin" --version
          # WHAT THIS KERNEL CAN ACTUALLY ENFORCE, recorded before anything runs.
          # "linux-x64" is not evidence: Landlock can be absent below 5.13 or
          # missing from the boot LSM list. The probe is the only thing that
          # answers that, and a run whose phases are `partial` should say so in
          # its log rather than in a report nobody opens.
          "$bin" probe | head -c 600; echo
        fi
