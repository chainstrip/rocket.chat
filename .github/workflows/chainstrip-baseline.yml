name: Chainstrip Baseline

# The heavy half of the split. Runs on master only, builds the full hardened
# artifact (chainstrip run: inventory -> trace -> sweep -> buildgate -> fileprune
# -> cove2e -> covtrim -> gate -> pack) and CACHES the gate-baseline set keyed on
# yarn.lock. Pull requests restore that instead of rebuilding it.
#
# This is the expensive job. It holds the self-hosted runner for hours, so what
# triggers it matters: paths that cannot change what the pipeline measures are
# ignored. chainstrip-baseline.yml itself is deliberately NOT ignored, because a
# change to this file DOES change the run.

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/ci-chainstrip.yml"
      # A one-off probe cannot change what the pipeline measures, and a
      # needless baseline OCCUPIES the runner for over an hour: on mattermost,
      # pushing a probe started a full baseline 6 seconds before the probe was
      # dispatched, and the measurement sat queued behind it.
      - ".github/workflows/chainstrip-probe-*.yml"
      - ".github/scripts/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: chainstrip-baseline
  cancel-in-progress: false

permissions: {}

jobs:
  baseline:
    name: Baseline (full run)
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'self-hosted' }}
    timeout-minutes: 720
    permissions:
      contents: read
      packages: read # read @chainstrip/cli from GitHub Packages with the ambient token
    env:
      CHAINSTRIP_RUN_ORIGIN: ci
      TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}
      # apps/meteor's own build:ci sets METEOR_DEBUG_BUILD and disables
      # optimistic caching. BABEL_ENV mirrors what .github/actions/meteor-build
      # passes for a production build, so the build oracle compiles the same way
      # the release pipeline does. A dev-mode build skips production-only plugins
      # and gates nothing.
      BABEL_ENV: production

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve tool versions
        id: tools
        run: |
          echo "node-version=$(node -p "require('./package.json').engines.node")" >> "$GITHUB_OUTPUT"
          echo "deno-version=$(awk '$1=="deno"{ print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      # THIS RUNNER HAS NO yarn ON PATH, and the project's own setup-node
      # action assumes one. It passes `cache: yarn` to actions/setup-node,
      # which shells out to `yarn --version` to locate the cache folder, and
      # that fails before anything else runs. GitHub-hosted images ship a
      # global yarn; a bare self-hosted runner does not. MEASURED: the first
      # baseline died here in 4 seconds with "Unable to locate executable
      # file: yarn".
      #
      # So provision node and turn on corepack FIRST. corepack puts a `yarn`
      # shim on PATH, and .yarnrc.yml pins yarnPath at the committed
      # .yarn/releases/yarn-4.12.0.cjs, so the shim runs that exact release
      # and downloads nothing. The project's action then runs unchanged.
      - name: Provision node for the corepack shim
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ steps.tools.outputs.node-version }}

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          yarn --version

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.tools.outputs.node-version }}
          deno-version: ${{ steps.tools.outputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # chainstrip's buildCommand is `yarn build:ci` inside apps/meteor, which is
      # `meteor build`. The tool must be on PATH before the run starts, or the
      # build gate reports every validated dependency as a build failure.
      # NO PASSWORDLESS sudo ON THIS RUNNER. The installer unpacks into
      # ~/.meteor and then tries to `sudo cp` a launcher into /usr/local/bin,
      # which fails with "a terminal is required to read the password". It then
      # exits ZERO having told you the remedy itself: put $HOME/.meteor on PATH.
      # MEASURED: the second baseline died here, `meteor: command not found`,
      # exit 127. The project's own meteor-build action does the sudo cp, which
      # works on a GitHub-hosted image and cannot work here.
      #
      # The launcher self-manages its version: run inside apps/meteor it reads
      # .meteor/release and fetches METEOR@3.4.1, whatever the bootstrap
      # installer happened to download.
      - name: Install Meteor
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl https://install.meteor.com | sed s/--progress-bar/-sL/g | /bin/sh || true
          fi
          test -x "$HOME/.meteor/meteor"
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      # A SEPARATE STEP, because GITHUB_PATH only takes effect in later ones.
      - name: Verify Meteor
        run: meteor --version

      # apps/meteor imports the workspace packages from their dist/, so nothing
      # runs until turbo has built them.
      - name: Build workspace packages
        run: yarn build

      # REFUSE TO MEASURE A TREE THE TESTS DO NOT LOAD. chainstrip writes every
      # overlay to <target>/node_modules/<name>, and node resolves nested-first,
      # so a workspace with its own node_modules shadows the overlay entirely.
      # MEASURED here: 61 of 63 validated dependencies resolved to
      # apps/meteor/node_modules and zero to the hoisted root, so a whole
      # 80-minute baseline was hollow and nothing in it said so. Failing loudly
      # beats publishing numbers that read as evidence.
      - name: Refuse a shadowed overlay tree
        run: node .github/scripts/check-overlay-tree.mjs

      - uses: ./.github/actions/setup-chainstrip
        with:
          version: ${{ vars.CHAINSTRIP_CLI_VERSION || 'latest' }}
          # chainstrip.config.json asks for `"sandbox": {"mode": "enforce"}` with
          # allowDegraded, so a missing launcher degrades and says so rather than
          # refusing. Set CHAINSTRIP_CSBOX_PACKAGE (or _PATH on this runner) to
          # contain the dependency code chainstrip executes.
          csbox: ${{ vars.CHAINSTRIP_CSBOX_PACKAGE || '' }}
          csbox_path: ${{ vars.CHAINSTRIP_CSBOX_PATH }}

      - name: Build the baseline
        run: $CHAINSTRIP run

      - name: Cache the gate baseline
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: chainstrip-baseline-${{ hashFiles('yarn.lock') }}
          # exactly the set the gate reads - NOT .chainstrip/workspaces|bundles|runs
          path: |
            .chainstrip/artifacts
            .chainstrip/extracted-deps
            .chainstrip/inventory.json
            .chainstrip/tiers.json
            .chainstrip/test-impact-map.json
            .chainstrip/covtrim-report.json
            .chainstrip/fileprune-report.json

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainstrip-baseline-report
          path: .chainstrip/*-report.json
          # .chainstrip is a DOT-directory and the action skips hidden paths by
          # default: without this the artifact uploads zero files and the step
          # still reports success.
          include-hidden-files: true
          if-no-files-found: ignore
