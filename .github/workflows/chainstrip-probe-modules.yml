name: Chainstrip Probe - build cache

# A one-off diagnostic, dispatched by hand. It answers three questions the
# first baseline raised and could not settle from its own reports.
#
#  Q1 Does apps/meteor carry NESTED node_modules copies of the packages
#     chainstrip overlays at the hoisted root? Twelve deps came back with
#     functionsTotal 0 - no coverage record at all - while apps/meteor imports
#     them heavily (react-i18next at 892 sites). Four of the twelve are
#     remapped by jest to <rootDir>/node_modules, which IS apps/meteor's own.
#     A dep the tests load from a nested copy is never the copy chainstrip
#     overlaid, so its validation and its coverage both describe the wrong
#     bytes.
#
#  Q2 Which copy does node actually resolve, asked from apps/meteor.
#
#  Q3 Does the Meteor build cache REPLAY? The baseline build took 177s and the
#     two overlay builds 33s and 31s. A 5x gap is the cached-replay signature,
#     and chainstrip's clearBuildCaches knows nothing about .meteor/local. The
#     decisive test is not timing: break the resolved copy of a dep the app
#     imports 892 times, rebuild warm, and see whether the build notices.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'self-hosted' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}
      BABEL_ENV: production
      VALIDATED: "@opentelemetry/api @react-aria/button @react-aria/dialog @react-aria/focus @react-aria/interactions @react-aria/overlays @react-aria/toolbar @react-aria/utils @react-aria/visually-hidden @react-stately/overlays @rocket.chat/css-in-js @rocket.chat/emitter @rocket.chat/fuselage @rocket.chat/fuselage-hooks @rocket.chat/fuselage-toastbar @rocket.chat/fuselage-tokens @rocket.chat/icons @rocket.chat/layout @rocket.chat/string-helpers @rocket.chat/styled @storybook/react @tanstack/react-query @testing-library/jest-dom bson codemirror cookie cron date-fns date.js debug ejson emojibase emojibase-data hono human-interval i18next i18next-sprintf-postprocessor lodash marked moment moment-timezone node-fetch node-rsa overlayscrollbars overlayscrollbars-react p-limit parseurl path-to-regexp prom-client qs query-string re-resizable react react-aria react-error-boundary react-hook-form react-i18next react-keyed-flatten-children react-virtuoso semver typia zod zustand"
      CANDIDATES: "react-i18next zustand ejson marked"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve tool versions
        id: tools
        run: |
          echo "node-version=$(node -p "require('./package.json').engines.node")" >> "$GITHUB_OUTPUT"
          echo "deno-version=$(awk '$1=="deno"{ print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Provision node for the corepack shim
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ steps.tools.outputs.node-version }}

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.tools.outputs.node-version }}
          deno-version: ${{ steps.tools.outputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Meteor
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl https://install.meteor.com | sed s/--progress-bar/-sL/g | /bin/sh || true
          fi
          test -x "$HOME/.meteor/meteor"
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Build workspace packages
        run: yarn build

      # ROUND 2 ANSWERED THE MODULE QUESTION AND MIS-ANSWERED THE CACHE ONE.
      # It broke the CJS entry require.resolve reported, rebuilt warm, and the
      # build passed in 31s - which reads as a replay. The control refuted it:
      # the SAME break also passed a COLD build in 37s, so that file is simply
      # not in the build graph and the probe measured nothing. A probe whose
      # result has two explanations has not measured anything.
      #
      # So stop guessing which file is compiled and MEASURE it. Stamp a unique
      # marker into every candidate file, build cold, and grep the built bundle:
      # a marker that appears is proof that file was compiled in. Only then is
      # breaking it a test of the cache rather than a test of nothing.
      - name: 'A: stamp markers into every candidate file'
        run: |
          set -euo pipefail
          : > /tmp/stamped.txt
          for d in $CANDIDATES; do
            dir=$(cd apps/meteor && node -e "
              try { const p=require.resolve('$d'); console.log(require('node:path').dirname(p)); } catch (e) {}
            ")
            if [ -z "$dir" ]; then
              echo "skip $d (unresolvable)"
              continue
            fi
            while IFS= read -r f; do
              id="CSMARK_$(echo "$f" | shasum | cut -c1-12)"
              cp "$f" "$f.csbak"
              printf '\n;globalThis[%s] = %s;\n' "\"$id\"" "\"$id\"" >> "$f"
              echo "$id $f" >> /tmp/stamped.txt
            done < <(find "$dir" -name '*.js' -not -path '*/node_modules/*' | head -20)
          done
          echo "stamped $(wc -l < /tmp/stamped.txt) file(s)"

      - name: 'B: COLD build, then find which markers reached the bundle'
        working-directory: apps/meteor
        run: |
          set -euo pipefail
          rm -rf .meteor/local
          s=$SECONDS
          if yarn build:ci > /tmp/coldB.log 2>&1; then
            echo "COLD build: pass in $((SECONDS-s))s"
          else
            echo "COLD build FAILED"
            tail -20 /tmp/coldB.log
            exit 1
          fi
          : > /tmp/compiled.txt
          while read -r id f; do
            if grep -rqF "$id" /tmp/dist 2>/dev/null; then echo "$id $f" >> /tmp/compiled.txt; fi
          done < /tmp/stamped.txt
          echo "markers that reached the bundle: $(wc -l < /tmp/compiled.txt) of $(wc -l < /tmp/stamped.txt)"
          cut -d' ' -f2- /tmp/compiled.txt | sed "s#$GITHUB_WORKSPACE/##" | head -10

      - name: 'C: restore the stamps, re-warm, then BREAK a proven-compiled file'
        working-directory: apps/meteor
        run: |
          set -euo pipefail
          # Put every stamped file back, so the only change in the decisive step
          # is the break itself.
          while read -r _ f; do cp "$f.csbak" "$f"; done < /tmp/stamped.txt

          if [ ! -s /tmp/compiled.txt ]; then
            echo "RESULT: NO marker reached the bundle."
            echo "        None of the candidates is compiled into this build, so the"
            echo "        cache question cannot be answered with them. It stays OPEN,"
            echo "        and the next probe needs a different candidate set."
            exit 0
          fi

          # Warm the cache with the restored (clean) tree, so the decisive build
          # differs from its predecessor ONLY by the break.
          yarn build:ci > /tmp/warmC.log 2>&1 || { echo "warm re-build failed"; tail -20 /tmp/warmC.log; exit 1; }

          target=$(head -1 /tmp/compiled.txt | cut -d' ' -f2-)
          echo "breaking a PROVEN-compiled file: ${target#"$GITHUB_WORKSPACE/"}"
          printf '\nthis is not valid javascript (((\n' >> "$target"
          s=$SECONDS
          if yarn build:ci > /tmp/brokenC.log 2>&1; then
            echo "RESULT: the build PASSED in $((SECONDS-s))s with a syntax error in a file"
            echo "        this same build was just proven to compile."
            echo "        THE METEOR CACHE REPLAYS. Every buildgate verdict on this"
            echo "        target is a false pass until chainstrip clears .meteor/local."
          else
            echo "RESULT: the build FAILED in $((SECONDS-s))s, as it must."
            echo "        The cache is content-aware, and the build gate is SOUND here."
            tail -12 /tmp/brokenC.log
          fi
          cp "$target.csbak" "$target"
