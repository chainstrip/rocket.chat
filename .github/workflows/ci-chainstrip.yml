name: Chainstrip Gate

# The light half of the split. Called from ci.yml on pull requests that touch
# dependency manifests. It RESTORES the baseline that chainstrip-baseline.yml
# cached on master and runs the no-arg update scan: chainstrip diffs the PR's
# installed tree against that baseline and classifies every dependency change
# (new dependency / expanded usage / version bump). A finding inside the block
# policy (chainstrip.config.json -> update.block) fails the check with a
# non-zero exit. A reviewer waives a safe block by committing
# chainstrip-approvals.json to the PR. See CHAINSTRIP.md.
#
# It never builds Meteor. The build oracle belongs to the baseline run.

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      deno-version:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false

permissions: {}

jobs:
  gate:
    name: Update Gate
    # The org runner carries the labels self-hosted,Linux,X64. A repo variable
    # overrides it so the runner can be changed without editing this file.
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'self-hosted' }}
    # The gate re-validates only the changed dependencies' mapped tests, but one
    # jest pass over apps/meteor is not cheap.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # read @chainstrip/cli from GitHub Packages with the ambient token
      pull-requests: write # the sticky verdict comment (gate-pr-comment.mjs)
    env:
      CHAINSTRIP_RUN_ORIGIN: ci
      TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THIS RUNNER HAS NO yarn ON PATH, and the project's own setup-node
      # action assumes one. It passes `cache: yarn` to actions/setup-node,
      # which shells out to `yarn --version` to locate the cache folder, and
      # that fails before anything else runs. GitHub-hosted images ship a
      # global yarn; a bare self-hosted runner does not. MEASURED: the first
      # baseline died here in 4 seconds with "Unable to locate executable
      # file: yarn".
      #
      # So provision node and turn on corepack FIRST. corepack puts a `yarn`
      # shim on PATH, and .yarnrc.yml pins yarnPath at the committed
      # .yarn/releases/yarn-4.12.0.cjs, so the shim runs that exact release
      # and downloads nothing. The project's action then runs unchanged.
      - name: Provision node for the corepack shim
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          yarn --version

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          deno-version: ${{ inputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # apps/meteor imports the workspace packages from their dist/, so the jest
      # suite cannot run until turbo has built them. ci.yml gets this from the
      # packages-build artifact; a workflow that does not depend on that job has
      # to build them itself.
      - name: Build workspace packages
        run: yarn build

      # REFUSE TO MEASURE A TREE THE TESTS DO NOT LOAD. chainstrip writes every
      # overlay to <target>/node_modules/<name>, and node resolves nested-first,
      # so a workspace with its own node_modules shadows the overlay entirely.
      # MEASURED here: 61 of 63 validated dependencies resolved to
      # apps/meteor/node_modules and zero to the hoisted root, so a whole
      # 80-minute baseline was hollow and nothing in it said so. Failing loudly
      # beats publishing numbers that read as evidence.
      - name: Refuse a shadowed overlay tree
        run: node .github/scripts/check-overlay-tree.mjs

      - name: Restore the baseline built on master
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: chainstrip-baseline-${{ hashFiles('yarn.lock') }}
          restore-keys: chainstrip-baseline-
          path: |
            .chainstrip/artifacts
            .chainstrip/extracted-deps
            .chainstrip/inventory.json
            .chainstrip/tiers.json
            .chainstrip/test-impact-map.json
            .chainstrip/covtrim-report.json
            .chainstrip/fileprune-report.json

      - uses: ./.github/actions/setup-chainstrip
        with:
          version: ${{ vars.CHAINSTRIP_CLI_VERSION || 'latest' }}
          csbox: ${{ vars.CHAINSTRIP_CSBOX_PACKAGE || '' }}
          csbox_path: ${{ vars.CHAINSTRIP_CSBOX_PATH }}

      - name: Gate the dependency change
        run: $CHAINSTRIP update # no-arg scan; non-zero exit on a blocking verdict

      - name: Comment the verdict on the PR # sticky: one comment, updated in place
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/gate-pr-comment.mjs "${{ github.event.pull_request.number }}"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainstrip-gate-report
          path: .chainstrip/gate-report.json
          include-hidden-files: true # .chainstrip is a dot-dir; hidden paths are skipped by default
          if-no-files-found: ignore
